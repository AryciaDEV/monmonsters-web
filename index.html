<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MonMonsters</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #121a29; color: white; font-family: system-ui, sans-serif; }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 16px; background: #121a29; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); }
    progress { width: min(70vw, 320px); accent-color: #7bd984; }
    #error { position: fixed; inset: auto 16px 16px; margin: 0; padding: 16px; background: #6c2430; border-radius: 8px; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="MonMonsters game"></canvas>
  <div id="loading" role="status"><h1>MonMonsters</h1><span>Loading game…</span><progress id="progress" max="1" value="0" aria-label="Loading progress"></progress></div>
  <p id="error" role="alert" hidden></p>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const errorBox = document.getElementById('error');
    function showError(message) {
      errorBox.textContent = 'The game could not start. Please reload the page. ' + message;
      errorBox.hidden = false;
      document.getElementById('loading').hidden = true;
    }
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const config = {
      dataUrl: 'Build/Website.data.unityweb',
      frameworkUrl: 'Build/Website.framework.js.unityweb',
      codeUrl: 'Build/Website.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "MonsterBrawl_Online",
      productVersion: "0.1",
      devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 1.5) : (window.devicePixelRatio || 1),
      showBanner: (message, type) => { if (type === 'error') showError(message); else console.warn(message); }
    };
    const loader = document.createElement('script');
    loader.src = 'Build/Website.loader.js';
    loader.onerror = () => showError('Could not download the game loader.');
    loader.onload = () => createUnityInstance(canvas, config, value => {
      document.getElementById('progress').value = value;
    }).then(() => {
      document.getElementById('loading').hidden = true;
      canvas.focus();
    }).catch(showError);
    document.body.appendChild(loader);
  </script>
</body>
</html>
